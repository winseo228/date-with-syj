<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 데이트하자! 💌</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffe6e8 0%, #fff1f3 100%);
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(255, 182, 193, 0.3);
      text-align: center;
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .step-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 20px;
      color: #2c2c2c;
      margin: 0 0 8px 0;
      word-break: keep-all;
      line-height: 1.4;
    }

    p.subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    #yesBtn, .primary-btn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
      width: 100%;
    }

    #yesBtn { width: auto; }

    #noBtn {
      background-color: #f0f0f0;
      color: #666;
      position: absolute;
      right: 20px;
      white-space: nowrap;
      transition: all 0.15s ease-out;
    }

    .step { display: none; }
    .step.active {
      display: block;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    .time-picker {
      display: flex;
      gap: 8px;
    }

    select, input[type="date"], input[type="time"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #eee;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    select { width: 35%; cursor: pointer; }
    input[type="time"] { width: 65%; }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fdf2f4;
      border: 1px solid #ffe1e6;
      border-radius: 10px;
      font-size: 13px;
      color: #444;
      cursor: pointer;
    }

    .checkbox-btn input { accent-color: #ff4d6d; }

    .summary-box {
      background: #fff8f9;
      border: 2px dashed #ffb6c1;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin: 15px 0;
    }

    .summary-item {
      font-size: 15px;
      color: #444;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .summary-item span.label {
      font-weight: bold;
      color: #ff4d6d;
      min-width: 65px;
    }

    .notice {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- STEP 1: 데이트 신청 -->
    <div id="step1" class="step active">
      <!-- 기본 초기 사진 (파란 옷) -->
      <img id="mainImg" src="yes.jpg" alt="데이트 신청 사진" class="step-img">
      
      <h1>나랑 데이트해 줄 거야? ❤️</h1>
      <p class="subtitle">선택의 여지는 없지만 골라봐!</p>
      
      <div class="btn-group">
        <button id="yesBtn">응, 좋아! 🥰</button>
        <button id="noBtn">아니오 😜</button>
      </div>
    </div>

    <!-- STEP 2: 날짜 & 시간 선택 -->
    <div id="step2" class="step">
      <!-- 데이트 승낙 시 나오는 파란 옷 사진 -->
      <img src="yes.jpg" alt="yes.jpg" class="step-img">
      
      <h1>야호! 데이트 일정 정하자! 🎉</h1>
      <p class="subtitle">원하는 날짜와 하고 싶은 걸 알려줘</p>

      <form id="dateForm">
        <div class="form-group">
          <label for="dateInput">🗓️ 데이트할 날짜</label>
          <input type="date" id="dateInput" required>
        </div>

        <div class="form-group">
          <label>⏰ 만나고 싶은 시간</label>
          <div class="time-picker">
            <select id="ampm">
              <option value="오전">오전</option>
              <option value="오후" selected>오후</option>
            </select>
            <input type="time" id="timeInput" value="01:00" required>
          </div>
        </div>

        <div class="form-group">
          <label>✨ 하고 싶은 것 (복수 선택 가능)</label>
          <div class="checkbox-grid">
            <label class="checkbox-btn"><input type="checkbox" name="activity" value="맛있는 음식 먹기 🍝" checked> 맛집 탐방</label>
            <label class="checkbox-btn"><input type="checkbox" name="activity" value="영화/전시회 보기 🎬"> 영화/전시</label>
            <label class="checkbox-btn"><input type="checkbox" name="activity" value="예쁜 카페 가기 ☕"> 카페 투어</label>
            <label class="checkbox-btn"><input type="checkbox" name="activity" value="드라이브/산책 🚗"> 드라이브</label>
          </div>
        </div>

        <div class="form-group">
          <label for="memoInput">💭 가고 싶은 곳이나 먹고 싶은 것</label>
          <input type="text" id="memoInput" placeholder="예: 맛있는 음식, 예쁜 카페 등!">
        </div>

        <button type="submit" class="primary-btn">약속 신청 완료하기 💌</button>
      </form>
    </div>

    <!-- STEP 3: 최종 약속 확정 -->
    <div id="step3" class="step">
      <!-- 최종 완료 시 나오는 파란 옷 사진 -->
      <img src="yes.jpg" alt="약속 확정 축하 사진" class="step-img">
      
      <h1>데이트 약속 신청 완료! 💕</h1>
      <p class="subtitle">아래 카드를 캡처해서 나한테 보내줘!</p>

      <div class="summary-box">
        <div class="summary-item">
          <span class="label">📅 날짜:</span>
          <span id="resDate">-</span>
        </div>
        <div class="summary-item">
          <span class="label">⏰ 시간:</span>
          <span id="resTime">-</span>
        </div>
        <div class="summary-item">
          <span class="label">✨ 활동:</span>
          <span id="resActivities">-</span>
        </div>
        <div class="summary-item" id="resMemoContainer">
          <span class="label">💭 위시:</span>
          <span id="resMemo">-</span>
        </div>
      </div>

      <p class="notice">💡 화면을 스크린샷해서 전달해주면 완벽해!</p>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const mainImg = document.getElementById('mainImg');

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const dateForm = document.getElementById('dateForm');

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;
    document.getElementById('dateInput').min = today;

    // '아니오' 버튼 선택하려고 다가가면 검은 옷 사진(no.jpg)으로 변경되면서 도망
    function moveButton() {
      const btnRect = noBtn.getBoundingClientRect();
      const x = Math.random() * (window.innerWidth - btnRect.width - 40) + 20;
      const y = Math.random() * (window.innerHeight - btnRect.height - 40) + 20;

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      // 아니오 누르려 할 때 검은 옷 사진으로 교체
      mainImg.src = 'no.jpg';
      mainImg.style.animation = 'none';
      mainImg.offsetHeight;
      mainImg.style.animation = 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener('click', () => {
      step1.classList.remove('active');
      step2.classList.add('active');
    });

    dateForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const dateVal = document.getElementById('dateInput').value;
      const ampmVal = document.getElementById('ampm').value;
      const timeVal = document.getElementById('timeInput').value;
      const memoVal = document.getElementById('memoInput').value;

      const checkedActivities = Array.from(document.querySelectorAll('input[name="activity"]:checked'))
                                     .map(cb => cb.value);

      document.getElementById('resDate').textContent = dateVal;
      document.getElementById('resTime').textContent = `${ampmVal} ${timeVal}`;
      document.getElementById('resActivities').textContent = checkedActivities.length > 0 ? checkedActivities.join(', ') : '자유 일정!';

      if (memoVal.trim() !== '') {
        document.getElementById('resMemo').textContent = memoVal;
      } else {
        document.getElementById('resMemoContainer').style.display = 'none';
      }

      step2.classList.remove('active');
      step3.classList.add('active');
    });
  </script>
</body>
</html>
